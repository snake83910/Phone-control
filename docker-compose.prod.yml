# =============================================================================
#  Phone Control — pile de production
#
#  Lancement :  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
#  Difference essentielle avec docker-compose.yml (developpement) : **aucun port
#  de base de donnees n'est publie**. PostgreSQL et Redis ne sont joignables que
#  depuis le reseau interne des conteneurs. Un VPS a une adresse publique et se
#  fait scanner dans l'heure qui suit sa mise en ligne ; une base exposee avec un
#  mot de passe faible n'y survit pas la journee.
#
#  Seul Caddy publie des ports : 80 et 443.
#
#  ---------------------------------------------------------------------------
#  DEUX PRODUITS SUR UNE MACHINE
#  ---------------------------------------------------------------------------
#  Le service `algo` n'appartient pas a Phone Control : c'est le calculateur de
#  Trajelys (planning CP-SAT et OCR). Les deux charges sont complementaires, ce
#  qui est rare et vaut la peine d'etre dit : Phone Control est limite par la
#  RAM et les entrees-sorties et n'utilisera que deux coeurs sur douze, alors
#  que CP-SAT est du calcul pur, sans etat, qui prendrait tout ce qu'on lui
#  laisse. Les faire cohabiter utilise une machine deja payee.
#
#  Ils ne se parlent PAS. `algo` s'adresse a Supabase par Internet, Phone
#  Control a son propre PostgreSQL. Ils ne partagent que le processeur, la
#  memoire et le proxy inverse.
#
#  D'ou les limites de ressources ci-dessous. Elles ne sont pas de l'optimisa-
#  tion : sans elles, une resolution CP-SAT a plein regime un jeudi apres-midi
#  affamerait le PostgreSQL qui recoit les positions de neuf mille telephones.
#  Le plafond d'`algo` a six coeurs garantit qu'il en reste toujours six pour
#  le reste, quoi qu'il arrive.
# =============================================================================

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Les fonctions de partitionnement raisonnent en UTC : la base doit y etre
      # aussi, quelle que soit l'heure du serveur.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12
    # PostgreSQL profite AUSSI du cache de pages du systeme, qui est hors de
    # cette limite : la somme des limites reste volontairement sous les 24 Go
    # pour lui en laisser.
    deploy:
      resources:
        limits: { cpus: '6', memory: 8G }
        reservations: { memory: 4G }
    # Tout attend la base. La faire passer apres un calcul de planning
    # ralentit l'ensemble du serveur, pas seulement une requete.
    cpu_shares: 4096
    networks: [interne]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `noeviction` : les compteurs de limitation de debit et les verrous de
    # taches planifiees ne doivent pas disparaitre sous pression memoire. Mieux
    # vaut une ecriture refusee qu'un verrou evapore et deux workers simultanes.
    command:
      [
        'redis-server',
        '--appendonly', 'yes',
        '--maxmemory-policy', 'noeviction',
        '--requirepass', '${REDIS_PASSWORD}',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }
        reservations: { memory: 256M }
    # Verrous et compteurs : peu de travail, mais sur le chemin critique.
    cpu_shares: 2048
    networks: [interne]

  # ---------------------------------------------------------------------------
  # Migrations, jouees a chaque demarrage AVANT l'API.
  #
  # Un conteneur ephemere plutot qu'une etape du demarrage de l'API : si la
  # migration echoue, l'API ne demarre pas du tout. Une API qui tourne sur un
  # schema qu'elle ne comprend pas produit des erreurs incomprehensibles a
  # chaque requete, ce qui est bien pire qu'un service arrete.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Etage dedie : il conserve la CLI Prisma, que l'image d'execution
      # n'embarque volontairement pas.
      target: migrate
    restart: 'no'
    # Toute la configuration, pas seulement DATABASE_URL : ce meme service sert
    # a lancer l'amorcage, qui demarre l'application complete et a donc besoin
    # de Redis et des secrets.
    #
    #   docker compose -f docker-compose.prod.yml --env-file .env.prod     #     run --rm --entrypoint sh migrate     #     -c "pnpm exec ts-node --transpile-only -P tsconfig.json prisma/seed.ts"
    env_file: [.env.prod]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [interne]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      NODE_ENV: production
      # Les taches planifiees vivent dans le worker, pas ici : sans quoi deux
      # instances d'API les executeraient toutes les deux.
      WORKER_ENABLED: 'false'
      APP_PACKAGE_STORAGE_DIR: /app/storage/app-packages
    volumes:
      - app-packages:/app/storage/app-packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { cpus: '3', memory: 1536M }
        reservations: { memory: 512M }
    # Ce sont les TELEPHONES. Une API affamee, c'est une flotte qui ne
    # remonte plus, de facon intermittente et incomprehensible.
    cpu_shares: 4096
    networks: [interne]

  # ---------------------------------------------------------------------------
  # Verrouillage de 22 h, surveillance, purge des donnees.
  #
  # UNE SEULE instance. Le verrou Redis protege deja contre le doublon, mais un
  # deuxieme worker ne servirait a rien : ces taches ne se parallelisent pas.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ['node', 'dist/worker-main.js']
    # Le worker partage l'image de l'API, donc son test de sante — qui interroge
    # un serveur HTTP que le worker n'a pas. Il resterait « unhealthy » a vie,
    # et un tableau de supervision finirait par apprendre a ignorer cette
    # couleur-la. Mieux vaut aucun test qu'un test qui ment.
    healthcheck:
      disable: true
    env_file: [.env.prod]
    environment:
      NODE_ENV: production
      WORKER_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { cpus: '2', memory: 1G }
    # Le verrouillage de 22 h compte, mais il tolere quelques secondes.
    cpu_shares: 1024
    networks: [interne]

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Adresse INTERNE : le tableau de bord parle a l'API par le reseau des
      # conteneurs, sans ressortir sur Internet ni repasser par TLS.
      API_INTERNAL_URL: http://api:3001/api
      # NEXT_PUBLIC_REALTIME_URL RETIREE, et c'est important de dire pourquoi.
      #
      # Next.js incorpore les variables `NEXT_PUBLIC_*` A LA CONSTRUCTION de
      # l'image. Posee ici, a l'execution, elle n'atteignait jamais le
      # navigateur : le client retombait silencieusement sur l'origine
      # courante, et le canal temps reel ne s'ouvrait jamais. La ligne donnait
      # l'illusion d'un reglage actif.
      #
      # Le flux passe desormais par `admin.<domaine>/socket.io/`, que Caddy
      # relaie vers l'API. La meme image fonctionne sur n'importe quel domaine.
      NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
      # --- Provisioning des telephones -------------------------------------
      # Enumerees une par une, et PAS par `env_file: [.env.prod]`. Ce fichier
      # porte le mot de passe de la base, les secrets JWT et le poivre des
      # badges : les verser dans le conteneur du tableau de bord etendrait a
      # lui seul la surface d'une faille cote navigateur. Il n'a besoin que de
      # ces valeurs-la.
      #
      # Constate a la mise en service : sans ce bloc, la page de provisioning
      # repondait « PROVISIONING_SERVER_URL n'est pas renseignee » meme apres
      # l'avoir posee dans .env.prod — le service n'avait aucun env_file, donc
      # la variable n'atteignait jamais le conteneur.
      #
      # Adresse PUBLIQUE de l'API : celle que le telephone appelle depuis le
      # reseau mobile. Surtout pas API_INTERNAL_URL, qui ne resout que dans le
      # reseau des conteneurs.
      PROVISIONING_SERVER_URL: ${PROVISIONING_SERVER_URL:-https://api.${PUBLIC_DOMAIN}/api/}
      PROVISIONING_SIGNATURE_CHECKSUM: ${PROVISIONING_SIGNATURE_CHECKSUM:-}
      PROVISIONING_APK_URL: ${PROVISIONING_APK_URL:-}
      PROVISIONING_PACKAGE_NAME: ${PROVISIONING_PACKAGE_NAME:-}
      PROVISIONING_ADMIN_COMPONENT: ${PROVISIONING_ADMIN_COMPONENT:-}
      PROVISIONING_SKIP_ENCRYPTION: ${PROVISIONING_SKIP_ENCRYPTION:-}
      PROVISIONING_LEAVE_SYSTEM_APPS: ${PROVISIONING_LEAVE_SYSTEM_APPS:-}
      PROVISIONING_LOCALE: ${PROVISIONING_LOCALE:-}
      PROVISIONING_TIMEZONE: ${PROVISIONING_TIMEZONE:-}
      PROVISIONING_ALLOW_INSECURE_DOWNLOAD: ${PROVISIONING_ALLOW_INSECURE_DOWNLOAD:-}
      PROVISIONING_WIFI_SSID: ${PROVISIONING_WIFI_SSID:-}
      PROVISIONING_WIFI_SECURITY: ${PROVISIONING_WIFI_SECURITY:-}
      PROVISIONING_WIFI_HIDDEN: ${PROVISIONING_WIFI_HIDDEN:-}
      PROVISIONING_WIFI_PASSWORD: ${PROVISIONING_WIFI_PASSWORD:-}
    depends_on:
      - api
    deploy:
      resources:
        limits: { cpus: '2', memory: 1G }
    # Des humains devant un ecran : tolerants, et peu nombreux.
    cpu_shares: 1024
    networks: [interne]

  # ---------------------------------------------------------------------------
  # Calculateur Trajelys : generation de planning (CP-SAT) et OCR des documents.
  #
  # Image PUBLIEE et non construite ici : le code vit dans le depot planning-dsp,
  # qu'un Compose ne peut pas atteindre. Elle est fabriquee par le workflow
  # `image-algo.yml` de ce depot-la et poussee sur GHCR.
  #
  # Deploiement d'une nouvelle version :
  #   docker compose -f docker-compose.prod.yml pull algo
  #   docker compose -f docker-compose.prod.yml up -d algo
  #
  # Retour arriere : remplacer `latest` par un SHA dans ALGO_IMAGE.
  # ---------------------------------------------------------------------------
  algo:
    image: ${ALGO_IMAGE:-ghcr.io/snake83910/trajelys-algo:latest}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      PORT: '8000'

      # --- Le reglage qui decide du temps d'attente le jeudi ----------------
      # MESURE, planning de 80 chauffeurs, budget 10 s, conteneur a 6 coeurs :
      #
      #   1 resolution x 6 fils CP-SAT  -> couverture 91,70 %,  6 plannings/min
      #   6 resolutions x 1 fil chacune -> couverture 91,70 %, 35 plannings/min
      #
      # Identique au centieme. Donner six fils a UNE resolution n'apporte rien,
      # parce que le solveur est borne en temps : il rend ce qu'il a trouve au
      # bout de CPSAT_MAX_TIME, quel que soit le nombre de fils. Repartir les
      # six coeurs sur six plannings multiplie donc le debit par six sans rien
      # couter a la qualite.
      #
      # Consequence a l'echelle visee : cent cinquante DSP qui generent leur
      # semaine le meme jeudi apres-midi passent de vingt-cinq minutes de file
      # a quatre. Vingt-cinq minutes depassaient le delai d'attente du
      # navigateur — les derniers arrives voyaient un message d'abandon.
      #
      # D'ou UN fil par resolution, et SIX resolutions de front.
      CPSAT_WORKERS: '1'
      WORKER_CONCURRENCE: '6'
      # Le semaphore doit laisser passer autant de resolutions qu'il y a de
      # workers, sinon il les re-serialise et tout ce qui precede est annule.
      CPSAT_MAX_CONCURRENT: '6'

      # Au passage : un conteneur lance avec `--cpus 6` voit quand meme DOUZE
      # coeurs (`os.cpu_count()` = 12, mesure). Tout code qui se dimensionne
      # sur `nproc` sur-alloue sans le savoir — c'est ce qui avait fait passer
      # l'OCR de trois secondes a plus de dix minutes, OpenMP lisant douze au
      # lieu du quota reel. Aucune valeur ici ne doit etre laissee a la
      # detection automatique.

      # Le worker de la file tourne ici. Plusieurs fils sur la meme file, sans
      # coordination : `for update skip locked` garantit que deux d'entre eux
      # ne prennent jamais la meme tache.
      WORKER_ACTIF: '1'

      # Origines autorisees a appeler depuis un navigateur. Sans la bonne
      # valeur, le site se fait refuser avec pour seul indice une erreur CORS
      # dans la console.
      ALGO_CORS_ORIGINES: ${ALGO_CORS_ORIGINES:-https://planning-dsp.vercel.app}

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      # Le demarrage charge OR-Tools et Tesseract : le declarer malade pendant
      # ce temps le ferait redemarrer en boucle.
      start_period: 60s

    # SIX coeurs, jamais plus. C'est la garantie qui rend la cohabitation sure :
    # quoi que fasse le solveur, il en reste six pour PostgreSQL et l'API qui
    # recoivent les positions des telephones.
    deploy:
      resources:
        limits: { cpus: '6', memory: 4G }
    # LE point de la manoeuvre. Le calculateur garde son plafond de six
    # coeurs — le jeudi doit rester rapide — mais son POIDS est le plus
    # faible de la pile : il prend tout ce qui est libre, et s'efface des
    # que les telephones ou la base en ont besoin.
    #
    # Mesure : `deploy.resources.reservations.cpus` est IGNORE par
    # `docker compose` (il ne vaut que pour Swarm ; le conteneur sort avec
    # CpuShares a 0). Seul `cpu_shares` arrive jusqu'au noyau. Une
    # reservation ecrite la aurait ete une garantie imaginaire.
    cpu_shares: 256

    networks: [interne]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # APK de provisioning, servi publiquement sur /provisioning/.
      # En lecture seule : ce conteneur n'a aucune raison d'y ecrire, et c'est
      # le seul chemin de la machine qu'il expose a Internet.
      - ./public/provisioning:/srv/provisioning:ro
      # Les certificats survivent aux redemarrages. Sans ce volume, chaque
      # `docker compose up` redemanderait un certificat a Let's Encrypt, dont
      # les quotas sont vite atteints.
      - caddy-data:/data
      - caddy-config:/config
    # Volontairement SANS `depends_on`.
    #
    # Un reverse proxy qui refuse de demarrer parce qu'un amont est absent
    # transforme la panne d'un service en panne de tout : si l'API tombe, on
    # perd aussi le tableau de bord et le calculateur, et on ne peut meme plus
    # lire une page d'erreur. Caddy repond 502 sur les noms dont l'amont
    # manque, et sert normalement les autres.
    #
    # C'est aussi ce qui permet de mettre le calculateur en service AVANT le
    # MDM : `up -d caddy algo` demarrait sinon toute la pile.
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }
        reservations: { memory: 128M }
    # Si le proxy s'etrangle, plus rien n'est joignable — ni les
    # telephones, ni le tableau de bord, ni le calculateur.
    cpu_shares: 4096
    networks: [interne]

networks:
  interne:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  # APK deposes. A sauvegarder au meme titre que la base : ils ne sont nulle
  # part ailleurs.
  app-packages:
